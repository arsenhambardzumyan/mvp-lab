<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boredom Timer</title>
<style>
  :root{
    --bg:#0e0d12;
    --bg2:#17151d;
    --surface:#1c1a24;
    --text:#f1eee8;
    --muted:#8b8798;
    --accent:#e8c15a;
    --accent-dim:#5a4f2c;
    --danger:#c9634f;
    --radius:20px;
    --ease:cubic-bezier(.16,1,.3,1);
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    background:radial-gradient(circle at 50% 20%, #241f2c 0%, var(--bg) 60%);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
    padding:24px;
  }
  .card{
    width:100%;
    max-width:380px;
    background:var(--surface);
    border:1px solid #2a2733;
    border-radius:var(--radius);
    padding:32px 28px 28px;
    box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
  }
  h1{margin:0 0 4px;font-size:1.4rem;letter-spacing:-.02em;}
  .tagline{margin:0 0 28px;color:var(--muted);font-size:.85rem;line-height:1.4;}
  .goal-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px;gap:12px;}
  .goal-row label{font-size:.8rem;color:var(--muted);}
  .goal-row input{
    width:70px;
    background:var(--bg2);
    border:1px solid #322e3c;
    border-radius:10px;
    color:var(--text);
    font-size:1rem;
    padding:8px 10px;
    text-align:center;
  }
  .goal-row input:disabled{opacity:.5;}
  .timer-wrap{position:relative;display:flex;align-items:center;justify-content:center;margin:8px 0 30px;}
  .pulse{
    position:absolute;
    width:210px;height:210px;
    border-radius:50%;
    background:radial-gradient(circle, var(--accent-dim) 0%, transparent 70%);
    opacity:0;
    transform:scale(.85);
  }
  .pulse.on{animation:breathe 4s var(--ease) infinite;}
  @keyframes breathe{
    0%,100%{opacity:.25;transform:scale(.85);}
    50%{opacity:.55;transform:scale(1.05);}
  }
  .display{position:relative;font-variant-numeric:tabular-nums;font-size:3.2rem;font-weight:600;letter-spacing:.02em;}
  .btn{
    display:block;
    width:100%;
    padding:14px;
    border:none;
    border-radius:14px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    transition:transform .15s var(--ease), background .2s;
  }
  .btn:active{transform:scale(.97);}
  .btn-start{background:var(--accent);color:#221c0d;}
  .btn-start:hover{background:#f0cd6f;}
  .btn-start:disabled{background:#3a3626;color:#77714f;cursor:not-allowed;}
  .btn-done{background:var(--danger);color:#2b110b;display:none;}
  .btn-done:hover{background:#dd7761;}
  .hint{text-align:center;color:var(--muted);font-size:.75rem;margin-top:10px;min-height:1.2em;}
  .stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
    margin-top:28px;
    padding-top:20px;
    border-top:1px solid #2a2733;
  }
  .stat{text-align:center;}
  .stat b{display:block;font-size:1.15rem;}
  .stat span{font-size:.68rem;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}
  button:focus-visible, input:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
</style>
</head>
<body>
<main class="card">
  <h1>Boredom Timer</h1>
  <p class="tagline">Phone off. Nothing to do. Let your mind wander — that's where the ideas come from.</p>

  <div class="goal-row">
    <label for="goalInput">Daily goal (min)</label>
    <input type="number" id="goalInput" min="1" max="240" step="1">
  </div>

  <div class="timer-wrap">
    <div class="pulse" id="pulse"></div>
    <div class="display" id="display">15:00</div>
  </div>

  <button class="btn btn-start" id="startBtn">START</button>
  <button class="btn btn-done" id="doneBtn">DONE</button>
  <p class="hint" id="hint">Put your phone face down and do nothing.</p>

  <div class="stats">
    <div class="stat"><b id="statToday">0</b><span>Today (min)</span></div>
    <div class="stat"><b id="statLongest">0</b><span>Longest (min)</span></div>
    <div class="stat"><b id="statStreak">0</b><span>Day streak</span></div>
  </div>
</main>

<script>
(function(){
  const KEY = 'boredomTimerState';

  function todayKey(){
    const d = new Date();
    return d.getFullYear() + '-' + (d.getMonth()+1) + '-' + d.getDate();
  }

  function defaultState(){
    return { date: todayKey(), goal: 15, minutesToday: 0, longestSession: 0, streak: 0, streakCounted: false };
  }

  function loadState(){
    let s;
    try { s = JSON.parse(localStorage.getItem(KEY)) || defaultState(); }
    catch(e){ s = defaultState(); }
    if (typeof s.goal !== 'number' || s.goal < 1) s.goal = 15;
    if (s.date !== todayKey()){
      if (!s.streakCounted) s.streak = 0;
      s.date = todayKey();
      s.minutesToday = 0;
      s.streakCounted = false;
    }
    return s;
  }

  function saveState(){ localStorage.setItem(KEY, JSON.stringify(state)); }

  let state = loadState();

  const goalInput = document.getElementById('goalInput');
  const display = document.getElementById('display');
  const startBtn = document.getElementById('startBtn');
  const doneBtn = document.getElementById('doneBtn');
  const hint = document.getElementById('hint');
  const pulse = document.getElementById('pulse');
  const statToday = document.getElementById('statToday');
  const statLongest = document.getElementById('statLongest');
  const statStreak = document.getElementById('statStreak');

  let totalSeconds = 0;
  let remaining = 0;
  let timerId = null;

  function formatTime(sec){
    const m = Math.floor(sec/60).toString().padStart(2,'0');
    const s = Math.floor(sec%60).toString().padStart(2,'0');
    return m + ':' + s;
  }

  function renderStats(){
    statToday.textContent = state.minutesToday;
    statLongest.textContent = state.longestSession;
    statStreak.textContent = state.streak;
    goalInput.value = state.goal;
  }

  function renderIdleDisplay(){
    display.textContent = formatTime(state.goal * 60);
  }

  function startSession(){
    state = loadState();
    const goal = parseInt(goalInput.value, 10);
    if (!goal || goal < 1) return;
    state.goal = goal;
    saveState();

    totalSeconds = goal * 60;
    remaining = totalSeconds;
    display.textContent = formatTime(remaining);

    goalInput.disabled = true;
    startBtn.style.display = 'none';
    doneBtn.style.display = 'block';
    pulse.classList.add('on');
    hint.textContent = 'Phone off. Just be. Tap DONE when you stop.';

    timerId = setInterval(function(){
      remaining--;
      display.textContent = formatTime(Math.max(remaining,0));
      if (remaining <= 0){
        finishSession(totalSeconds);
      }
    }, 1000);
  }

  function finishSession(elapsedSeconds){
    clearInterval(timerId);
    timerId = null;

    const elapsedMinutes = Math.max(1, Math.round(elapsedSeconds / 60));
    state = loadState();
    state.minutesToday += elapsedMinutes;
    if (elapsedMinutes > state.longestSession) state.longestSession = elapsedMinutes;
    if (!state.streakCounted && state.minutesToday >= state.goal){
      state.streak += 1;
      state.streakCounted = true;
    }
    saveState();

    goalInput.disabled = false;
    startBtn.style.display = 'block';
    doneBtn.style.display = 'none';
    pulse.classList.remove('on');
    hint.textContent = state.minutesToday >= state.goal
      ? 'Goal hit. Nicely done.'
      : 'Session logged. Go again anytime.';

    renderStats();
    renderIdleDisplay();
  }

  startBtn.addEventListener('click', startSession);
  doneBtn.addEventListener('click', function(){
    if (timerId) finishSession(totalSeconds - remaining);
  });
  goalInput.addEventListener('change', function(){
    let v = parseInt(goalInput.value, 10);
    if (!v || v < 1) v = 1;
    if (v > 240) v = 240;
    goalInput.value = v;
    state.goal = v;
    saveState();
    renderIdleDisplay();
  });

  renderStats();
  renderIdleDisplay();
})();
</script>
</body>
</html>
